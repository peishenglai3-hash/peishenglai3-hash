<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="records, sources, a temporary closure, and a person who can leave">
  <style>
    .lattice circle, .lattice line { stroke: #8A96A3; fill: #8A96A3; opacity: .45; stroke-width: 1.2; }
    .cluster .node { fill: #8A96A3; opacity: .92; }
    .cluster .edge { stroke: #8A96A3; opacity: .6; stroke-width: 1.2; }
    .closure { fill: none; stroke: #8A96A3; stroke-opacity: .6; stroke-width: 1.6; stroke-dasharray: 8 12; animation: closemove 19s linear infinite; }
    .exit { stroke: #B44B32; stroke-opacity: .85; stroke-width: 1.8; stroke-dasharray: 4 9; animation: exitpulse 9s ease-in-out infinite; }
    .ring { fill: none; stroke: #B44B32; stroke-opacity: .85; stroke-width: 2; animation: exitpulse 9s ease-in-out infinite; }
    @keyframes closemove { to { stroke-dashoffset: -72; } }
    @keyframes exitpulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .closure, .exit, .ring { animation: none; } }
  </style>
  
