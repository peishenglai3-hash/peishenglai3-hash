    <text x="450.0" y="73.0" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',Georgia,serif" font-size="17" fill="#ece2cf" text-anchor="middle"><tspan font-family="'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace" font-size="11" letter-spacing="1" fill="#a99f8c">01</tspan><tspan dx="7">扰动 / 具体经验</tspan></text>
  </g>
